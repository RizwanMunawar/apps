{% extends "base.html" %}
{% block title %}Sign in · Redact API{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="login-card">
    <div class="brand" style="justify-content:center">
      <span class="dot"></span>
      <span>Redact API<small>{{ brand }}</small></span>
    </div>
    {% if flash %}<div class="flash ok">{{ flash }}</div>{% endif %}
    {% if error %}<div class="flash bad">{{ error }}</div>{% endif %}
    <form class="card" method="post" action="/admin/login">
      <h2>Admin sign in</h2>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" required autofocus autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" required autocomplete="current-password">
      </div>
      <button class="btn" type="submit" style="width:100%">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
